name: Qualidade Flutter

on:
  push:
    branches: [liminha]
    paths:
      - .github/workflows/qualidade.yml
      - analysis_options.yaml
      - pubspec.*
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'android/**'
      - 'web/**'
      - 'windows/**'

permissions:
  contents: read

concurrency:
  group: qualidade-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  verificacoes:
    name: Análise, testes, Web e Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolver dependências com o lockfile
        run: flutter pub get --enforce-lockfile

      - name: Verificar formatação dos arquivos Dart alterados
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base="$BEFORE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify HEAD^)"
          fi

          changed="$RUNNER_TEMP/dart-format-files"
          git diff --name-only --diff-filter=ACMRT -z "$base" "$GITHUB_SHA" -- '*.dart' > "$changed"
          mapfile -d '' -t files < "$changed"
          if (( ${#files[@]} > 0 )); then
            dart format --output=none --set-exit-if-changed -- "${files[@]}"
          fi

      - name: Analisar Dart
        run: flutter analyze --no-pub --fatal-warnings --no-fatal-infos

      - name: Executar testes no runner local
        run: flutter test --no-pub --reporter expanded

      - name: Compilar Web com recursos locais
        run: flutter build web --no-pub --no-web-resources-cdn

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vethome-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Preparar SDK e NDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'ndk;28.2.13676358'

      - name: Compilar APK de depuração
        run: flutter build apk --debug --no-pub

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vethome-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 debug
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolver dependências com o lockfile
        run: flutter pub get --enforce-lockfile

      - name: Compilar Windows x64 de depuração
        run: flutter build windows --debug --no-pub

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vethome-windows-x64-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 7
