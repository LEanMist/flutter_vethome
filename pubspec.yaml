name: flutter_vethome
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_inset_shadow: ^2.0.3

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  web: ^1.1.1
  http: ^1.6.0
  flutter_svg: '>=2.2.4 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    - assets/imagens/pets/
    - assets/imagens/figma/

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/ComfortaaRegular.ttf
          weight: 400
        - asset: assets/fonts/ComfortaaMedium.ttf
          weight: 500
        - asset: assets/fonts/ComfortaaBold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
    - family: Montserrat
      fonts:
        - asset: assets/fonts/MontserratVariable.ttf
          weight: 100
        - asset: assets/fonts/MontserratVariable.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Raleway
      fonts:
        - asset: assets/fonts/RalewayVariable.ttf
          weight: 100
        - asset: assets/fonts/RalewayVariable.ttf
          weight: 900
    - family: MontserratAlternates
      fonts:
        - asset: assets/fonts/MontserratAlternatesRegular.ttf
          weight: 400
        - asset: assets/fonts/MontserratAlternatesMedium.ttf
          weight: 500
        - asset: assets/fonts/MontserratAlternatesBold.ttf
          weight: 700
