name: flutter_vethome
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_inset_shadow: ^2.0.3

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    - assets/imagens/pets/
    - assets/imagens/figma/

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/ComfortaaRegular.ttf
          weight: 400
        - asset: assets/fonts/ComfortaaMedium.ttf
          weight: 500
        - asset: assets/fonts/ComfortaaBold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
    - family: MontserratAlternates
      fonts:
        - asset: assets/fonts/MontserratAlternatesRegular.ttf
          weight: 400
        - asset: assets/fonts/MontserratAlternatesMedium.ttf
          weight: 500
        - asset: assets/fonts/MontserratAlternatesBold.ttf
          weight: 700
