name: flutter_vethome
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  flutter_inset_shadow: ^2.0.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    - assets/imagens/pets/

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/ComfortaaBold.ttf
          weight: 700
    - family: MontserratAlternates
      fonts:
        - asset: assets/fonts/MontserratAlternatesBold.ttf
          weight: 700